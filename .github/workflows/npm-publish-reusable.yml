name: Publish npm package

on:
  workflow_call:
    inputs:
      build-before-publish:
        description: Run build and test before publishing
        type: boolean
        default: true
      stub-package-dir:
        description: Path to stub package directory (e.g. packages/opensea-js-stub)
        type: string
        default: ""
      node-version-file:
        description: Path to node version file
        type: string
        default: .nvmrc
    secrets:
      OPENSEA_API_KEY:
        required: false
      ALCHEMY_API_KEY:
        required: false

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ${{ inputs.node-version-file }}
          registry-url: https://registry.npmjs.org/

      # Use npm install (not npm ci) because the package-lock.json may be
      # out of sync after the sync-package workflow resolves workspace: protocols
      # and updates dependencies. npm ci requires exact lockfile match.
      #
      # --legacy-peer-deps mirrors pnpm's permissive peer-dep behavior used in the
      # monorepo. Without it, packages like api-types fail on openapi-typescript@^7
      # which declares a strict `typescript@^5.x` peer while we ship typescript@^6.
      - run: npm install --legacy-peer-deps

      - if: ${{ inputs.build-before-publish }}
        run: npm run build

      - if: ${{ inputs.build-before-publish }}
        run: npm test
        env:
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}

      - run: npm publish --provenance --access public

      # A stub keeps one version across many releases of the main package, so it publishes only
      # when that version is not on npm yet. Any other registry answer fails the job.
      - if: ${{ inputs.stub-package-dir != '' }}
        working-directory: ${{ inputs.stub-package-dir }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          status=$(curl -sS --retry 3 -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${name/\//%2F}/${version}" || true)
          case "$status" in
            200) echo "$name@$version is already on npm, skipping the stub publish." ;;
            404) npm publish --provenance --access public ;;
            *) echo "::error::npm registry answered HTTP $status for $name@$version. The main package already published; the stub did not." && exit 1 ;;
          esac
